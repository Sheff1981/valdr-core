name: VALDR Go CI

on:
  workflow_dispatch:
  push:
    branches: [ main, valdr-v0.1-go, valdr-v0.2-dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Validate devnet scripts
        run: |
          bash -n ./scripts/start-devnet.sh
          bash -n ./scripts/test-devnet-v0.1.sh
          bash -n ./scripts/test-explorer-v0.2.sh

      - name: Smoke test local three-node devnet
        run: ./scripts/start-devnet.sh smoke

      - name: Final VALDR v0.1 integration
        run: ./scripts/test-devnet-v0.1.sh

      - name: VALDR v0.2 explorer integration
        run: ./scripts/test-explorer-v0.2.sh
