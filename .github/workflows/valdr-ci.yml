name: VALDR Go CI

on:
  workflow_dispatch:
  push:
    branches: [ main, valdr-v0.1-go ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Validate devnet script
        run: bash -n ./scripts/start-devnet.sh

      - name: Smoke test local three-node devnet
        run: ./scripts/start-devnet.sh smoke
