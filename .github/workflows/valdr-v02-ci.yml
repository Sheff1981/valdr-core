name: VALDR v0.2 CI

on:
  workflow_dispatch:
  push:
    branches: [ valdr-v0.2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Stage 13 release manifest gate
        run: go test ./cmd/valdr-release-manifest -count=1

      - name: Race test
        run: go test -race ./...

      - name: Storage v2 and migration gate
        run: go test ./storage ./core/blockchain ./cmd/valdrd

      - name: Network profiles and P2P v2 gate
        run: go test ./config ./p2p

      - name: Chainwork and reorg gate
        run: go test ./core/consensus ./core/blockchain ./storage

      - name: Difficulty v2 and timestamp gate
        run: go test ./config ./core/consensus

      - name: Fees and consensus size gate
        run: go test ./core/transaction ./core/block ./core/utxo ./core/blockchain ./mining

      - name: Mempool policy and miner template gate
        run: go test ./config ./core/mempool ./core/blockchain ./p2p ./mining

      - name: Headers-first sync gate
        run: go test ./p2p -run "TestV2(FreshNodeHeadersFirstSync|SyncResumesFromPersistedChainAfterRestart|HeadersFirstSyncReorgsToGreaterChainwork|SyncDecisionUsesCumulativeChainwork|LocatorContract|HeadersContract|InventoryContract)$" -count=1

      - name: Seed and P2P protection gate
        run: go test ./p2p -run "Test(SeedBootstrapContinuesPastOfflineSeed|InboundReservationLimits|TemporaryBanAfterMalformedThreshold|PublicDiscoveryRejectsUnsafeNumericAddresses|TokenBucketRejectsBurstAboveConfiguredLimit|BoundedDuplicateCacheEvictsOldest|IdleWatchdogPingsBeforeDisconnect|DiscoveryContinuesBeyondSeedNodes|LegacyBootstrapAndMaintainDoesNothingWithoutSeeds|BootstrapAndMaintainUsesDiscoveredPeersWithoutSeeds|ProtectionDefaultValues|V2PerMessagePayloadLimits)$" -count=1

      - name: Wallet v2 encryption and migration gate
        run: go test ./wallet ./cmd/valdr-cli -run "Test(Wallet|RPCBackedCLIStatusBalanceSendAndQueries)" -count=1

      - name: Explorer API and reorg gate
        run: go test ./explorer -run "TestExplorer" -count=1

      - name: Testnet runtime identity gate
        run: go test ./config ./core/block ./cmd/valdrd -run "Test(Testnet|V02NetworkProfiles)" -count=1

      - name: Stage 12 Desktop foundation gate
        run: go test ./desktop ./p2p -run "Test(Desktop|ResolveDesktop|OutboundOnly)" -count=1

      - name: Stage 12 RPC P2P and log secret-boundary gate
        run: go test ./desktop ./p2p -run "Test(DesktopRPCWireExcludesWalletSecrets|P2PWireAndTransactionLogsExcludeWalletSecrets)$" -count=1

      - name: v0.2.4 transaction network-binding gate
        run: go test ./core/transaction ./core/mempool ./core/blockchain ./wallet -run "Test(V2TransactionIsBoundToExpectedChain|V2CoinbaseIsBoundToExpectedChain|LegacyTransactionStillOmitsExplicitChainID|MempoolRejectsTransactionFromAnotherV2Network|TestnetRejectsDevnet2TransactionReplay|CreateTransactionForChainBuildsV2NetworkBoundTransaction)$" -count=1

      - name: Stage 12 outbound-only runtime smoke
        run: bash scripts/desktop-outbound-smoke.sh

      - name: Docker image build
        run: docker build -t valdr:testnet-v0.2 .

      - name: Docker Compose Testnet smoke
        run: bash scripts/docker-testnet-smoke.sh

      - name: Linux service smoke
        run: bash scripts/linux-service-smoke.sh

      - name: Three-node runtime smoke
        run: ./scripts/start-devnet.sh smoke


  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            imagemagick \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test -tags webkit2_41 ./...

      - name: Build Wails Desktop shell
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -tags "webkit2_41" -platform linux/amd64 -o VALDR

      - name: Bundle managed node and miner
        run: |
          go build -o apps/valdr-desktop/build/bin/valdrd ./cmd/valdrd
          go build -o apps/valdr-desktop/build/bin/valdr-miner ./cmd/valdr-miner
          test -x apps/valdr-desktop/build/bin/VALDR
          test -x apps/valdr-desktop/build/bin/valdrd
          test -x apps/valdr-desktop/build/bin/valdr-miner
          apps/valdr-desktop/build/bin/valdrd version
          apps/valdr-desktop/build/bin/valdr-miner version

      - name: Live Desktop wallet send/receive/history integration
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdr-miner
        run: go test -tags webkit2_41 -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          LOG="$RUNNER_TEMP/valdr-desktop-linux.log"

          Xvfb :99 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          apps/valdr-desktop/build/bin/VALDR >"$LOG" 2>&1 &
          DESKTOP_PID=$!

          stop_process() {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 0.25
            done
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          cleanup() {
            stop_process "$DESKTOP_PID"
            stop_process "$XVFB_PID"
          }
          trap cleanup EXIT

          sleep 5
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc             -H 'Content-Type: application/json'             --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh Desktop unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          stop_process "$DESKTOP_PID"
          stop_process "$XVFB_PID"
          trap - EXIT

      - name: Build Stage 13 Linux development packages
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-linux"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          bash scripts/package-linux-stage13.sh \
            --bin-dir apps/valdr-desktop/build/bin \
            --output-dir "$DIST"

          VERSION="$(apps/valdr-desktop/build/bin/valdrd version | awk '{print $NF}')"
          APPIMAGE="VALDR-Desktop-$VERSION-linux-x64.AppImage"
          DEB="VALDR-Desktop-$VERSION-linux-amd64.deb"

          cat >"$DIST/artifact-metadata.json" <<EOF
          {
            "artifacts": [
              {
                "filename": "$APPIMAGE",
                "os": "linux",
                "arch": "amd64",
                "minimum_os": "Linux x86_64; CI baseline Ubuntu 24.04",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              },
              {
                "filename": "$DEB",
                "os": "linux",
                "arch": "amd64",
                "minimum_os": "Debian/Ubuntu x86_64; CI baseline Ubuntu 24.04",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              }
            ]
          }
          EOF

          RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          go run ./cmd/valdr-release-manifest \
            --artifacts-dir "$DIST" \
            --metadata "$DIST/artifact-metadata.json" \
            --commit "$GITHUB_SHA" \
            --released-at "$RELEASED_AT" \
            --output "$DIST/release-manifest.json" \
            --development
          rm "$DIST/artifact-metadata.json"

          python3 - "$DIST/release-manifest.json" "$DIST" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          dist = pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text())
          assert manifest["development"] is True
          for artifact in manifest["artifacts"]:
              path = dist / artifact["filename"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == artifact["sha256"], artifact["filename"]
              assert path.stat().st_size == artifact["size_bytes"], artifact["filename"]
          PY

      - name: Clean-run Stage 13 Linux AppImage development package
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-linux"
          APPIMAGE="$(find "$DIST" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"

          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          Xvfb :98 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb-stage13-appimage.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:98
          LOG="$RUNNER_TEMP/valdr-stage13-appimage.log"

          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" >"$LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc \
            -H 'Content-Type: application/json' \
            --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh AppImage unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          cleanup
          trap - EXIT

      - name: Clean install and uninstall Stage 13 Linux deb development package
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-linux"
          DEB="$(find "$DIST" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"

          sudo apt-get install -y "$DEB"
          test -x /usr/lib/valdr-desktop/VALDR
          test -x /usr/lib/valdr-desktop/valdrd
          test -x /usr/lib/valdr-desktop/valdr-miner
          test -x /usr/bin/valdr-desktop
          /usr/lib/valdr-desktop/valdrd version
          /usr/lib/valdr-desktop/valdr-miner version

          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_DATA_HOME/valdr"
          echo preserve >"$XDG_DATA_HOME/valdr/stage13-uninstall-preserve.marker"

          Xvfb :97 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb-stage13-deb.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:97
          LOG="$RUNNER_TEMP/valdr-stage13-deb.log"
          /usr/bin/valdr-desktop >"$LOG" 2>&1 &
          APP_PID=$!

          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$LOG"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          wait "$XVFB_PID" 2>/dev/null || true

          sudo apt-get remove -y valdr-desktop
          test ! -e /usr/lib/valdr-desktop
          test ! -e /usr/bin/valdr-desktop
          test -f "$XDG_DATA_HOME/valdr/stage13-uninstall-preserve.marker"

      - name: Upload Stage 13 Linux development packages
        uses: actions/upload-artifact@v4
        with:
          name: valdr-stage13-linux-development
          path: ${{ runner.temp }}/valdr-stage13-linux/**
          if-no-files-found: error

      - name: Upload Linux Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: valdr-desktop-linux-amd64
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error

  desktop-native:
    name: desktop-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2025
            platform: windows/amd64
            output: VALDR.exe
            artifact: valdr-desktop-windows-amd64
            wails_args: "-webview2 embed"
          - name: macos-arm64
            os: macos-15
            platform: darwin/arm64
            output: VALDR
            artifact: valdr-desktop-macos-arm64
            wails_args: ""
          - name: macos-amd64
            os: macos-15-intel
            platform: darwin/amd64
            output: VALDR
            artifact: valdr-desktop-macos-amd64
            wails_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show native runner architecture
        run: go env GOOS GOARCH

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test ./...

      - name: Build native Wails Desktop
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -platform "${{ matrix.platform }}" -o "${{ matrix.output }}" ${{ matrix.wails_args }}

      - name: Bundle managed node and miner on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          go build -o "apps/valdr-desktop/build/bin/valdrd.exe" ./cmd/valdrd
          go build -o "apps/valdr-desktop/build/bin/valdr-miner.exe" ./cmd/valdr-miner
          if (-not (Test-Path "apps/valdr-desktop/build/bin/VALDR.exe")) { throw "VALDR.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdrd.exe")) { throw "valdrd.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdr-miner.exe")) { throw "valdr-miner.exe missing" }
          & "apps/valdr-desktop/build/bin/valdrd.exe" version
          & "apps/valdr-desktop/build/bin/valdr-miner.exe" version

      - name: Bundle managed node and miner on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          test -d "$APP/Contents/MacOS"
          go build -o "$APP/Contents/MacOS/valdrd" ./cmd/valdrd
          go build -o "$APP/Contents/MacOS/valdr-miner" ./cmd/valdr-miner
          test -x "$APP/Contents/MacOS/VALDR"
          test -x "$APP/Contents/MacOS/valdrd"
          test -x "$APP/Contents/MacOS/valdr-miner"
          "$APP/Contents/MacOS/valdrd" version
          "$APP/Contents/MacOS/valdr-miner" version
          codesign --force --sign - "$APP/Contents/MacOS/valdrd"
          codesign --force --sign - "$APP/Contents/MacOS/valdr-miner"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Live Desktop wallet send/receive/history integration on Windows
        if: matrix.name == 'windows-amd64'
        working-directory: apps/valdr-desktop
        shell: pwsh
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdrd.exe
          VALDR_MINER_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdr-miner.exe
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Live Desktop wallet send/receive/history integration on macOS
        if: startsWith(matrix.name, 'macos-')
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdr-miner
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valdr-desktop-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.err.log"
          $desktop = Start-Process -FilePath "apps/valdr-desktop/build/bin/VALDR.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          Start-Sleep -Seconds 5
          if ($desktop.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "VALDR Desktop exited during clean first-run launch"
          }
          try {
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}' | Out-Null
            Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            throw "fresh Desktop unexpectedly started valdrd before first wallet setup"
          } catch {
            if ($_.Exception.Message -eq "fresh Desktop unexpectedly started valdrd before first wallet setup") {
              throw
            }
          }

          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

      - name: Clean-launch Desktop smoke on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          LOG="$RUNNER_TEMP/valdr-desktop-macos.log"

          "$APP/Contents/MacOS/VALDR" >"$LOG" 2>&1 &
          DESKTOP_PID=$!
          cleanup() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 5
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc             -H 'Content-Type: application/json'             --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh Desktop unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Build Stage 13 macOS development package
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          DIST="$RUNNER_TEMP/valdr-stage13-${{ matrix.name }}"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          case "${{ matrix.name }}" in
            macos-arm64)
              ARCH="arm64"
              FILE_ARCH="arm64"
              MANIFEST_ARCH="arm64"
              MIN_OS="macOS 11.0+ ARM64"
              ;;
            macos-amd64)
              ARCH="amd64"
              FILE_ARCH="x64"
              MANIFEST_ARCH="amd64"
              MIN_OS="macOS 10.13+ Intel x64"
              ;;
            *)
              echo "unsupported macOS matrix target: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

          bash scripts/package-macos-stage13.sh \
            --app "$APP" \
            --output-dir "$DIST" \
            --arch "$ARCH"

          VERSION="$("$APP/Contents/MacOS/valdrd" version | awk '{print $NF}')"
          DMG="VALDR-Desktop-$VERSION-macos-$FILE_ARCH.dmg"
          test -s "$DIST/$DMG"

          cat >"$DIST/artifact-metadata.json" <<EOF
          {
            "artifacts": [
              {
                "filename": "$DMG",
                "os": "macos",
                "arch": "$MANIFEST_ARCH",
                "minimum_os": "$MIN_OS",
                "signing_status": "adhoc-development",
                "notarization_status": "not-notarized-development"
              }
            ]
          }
          EOF

          RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          go run ./cmd/valdr-release-manifest \
            --artifacts-dir "$DIST" \
            --metadata "$DIST/artifact-metadata.json" \
            --commit "$GITHUB_SHA" \
            --released-at "$RELEASED_AT" \
            --output "$DIST/release-manifest.json" \
            --development
          rm "$DIST/artifact-metadata.json"

          python3 - "$DIST/release-manifest.json" "$DIST/$DMG" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          artifact_path = pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text())
          assert manifest["development"] is True
          assert len(manifest["artifacts"]) == 1
          artifact = manifest["artifacts"][0]
          assert artifact["filename"] == artifact_path.name
          assert artifact["sha256"] == hashlib.sha256(artifact_path.read_bytes()).hexdigest()
          assert artifact["size_bytes"] == artifact_path.stat().st_size
          assert artifact["signing_status"] == "adhoc-development"
          assert artifact["notarization_status"] == "not-notarized-development"
          PY

      - name: Clean mount and launch Stage 13 macOS development package
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-${{ matrix.name }}"
          DMG="$(find "$DIST" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          hdiutil verify "$DMG" >/dev/null

          MOUNT="$RUNNER_TEMP/valdr-stage13-mount-${{ matrix.name }}"
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly >/dev/null

          APP="$MOUNT/VALDR Desktop.app"
          DESKTOP="$APP/Contents/MacOS/VALDR"
          NODE="$APP/Contents/MacOS/valdrd"
          MINER="$APP/Contents/MacOS/valdr-miner"

          cleanup_mount() {
            hdiutil detach "$MOUNT" >/dev/null 2>&1 || hdiutil detach -force "$MOUNT" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT

          test -x "$DESKTOP"
          test -x "$NODE"
          test -x "$MINER"
          "$NODE" version
          "$MINER" version
          codesign --verify --deep --strict "$APP"

          export HOME="$(mktemp -d)"
          LOG="$RUNNER_TEMP/valdr-stage13-macos-${{ matrix.name }}.log"
          "$DESKTOP" >"$LOG" 2>&1 &
          DESKTOP_PID=$!

          cleanup_app() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
          }
          trap 'cleanup_app; cleanup_mount' EXIT

          sleep 5
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc \
            -H 'Content-Type: application/json' \
            --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh packaged Desktop unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          cleanup_app
          cleanup_mount
          trap - EXIT

      - name: Upload Stage 13 macOS development package
        if: startsWith(matrix.name, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: valdr-stage13-${{ matrix.name }}-development
          path: ${{ runner.temp }}/valdr-stage13-${{ matrix.name }}/**
          if-no-files-found: error
      - name: Install NSIS for Stage 13 Windows packaging
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $command) {
            choco install nsis -y --no-progress
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "${env:ProgramFiles}\NSIS\makensis.exe"
            )
            $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $path) { throw "makensis.exe not found after NSIS installation" }
          } else {
            $path = $command.Source
          }
          & $path /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis version check failed" }
          "VALDR_MAKENSIS=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Stage 13 Windows development packages
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "apps\valdr-desktop\build\bin"
          $desktop = Join-Path $bin "VALDR.exe"
          $node = Join-Path $bin "valdrd.exe"
          $miner = Join-Path $bin "valdr-miner.exe"

          $versionLine = (& $node version | Out-String).Trim()
          $version = ($versionLine -split "\s+")[-1]
          if ($version -notmatch "^(\d+)\.(\d+)\.(\d+)") {
            throw "cannot derive numeric file version from $version"
          }
          $fileVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"

          $dist = Join-Path $env:RUNNER_TEMP "valdr-stage13-windows"
          $portableDir = Join-Path $env:RUNNER_TEMP "valdr-stage13-portable"
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist, $portableDir | Out-Null

          $installerName = "VALDR-Desktop-$version-windows-x64-setup.exe"
          $portableName = "VALDR-Desktop-$version-windows-x64-portable.zip"
          $installer = Join-Path $dist $installerName
          $portable = Join-Path $dist $portableName

          & $env:VALDR_MAKENSIS `
            "/DAPP_VERSION=$version" `
            "/DAPP_FILE_VERSION=$fileVersion" `
            "/DOUTFILE=$installer" `
            "/DDESKTOP_EXE=$desktop" `
            "/DNODE_EXE=$node" `
            "/DMINER_EXE=$miner" `
            "packaging\windows\valdr-desktop.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS package build failed" }
          if (-not (Test-Path $installer)) { throw "Windows installer missing" }

          Copy-Item $desktop (Join-Path $portableDir "VALDR.exe")
          Copy-Item $node (Join-Path $portableDir "valdrd.exe")
          Copy-Item $miner (Join-Path $portableDir "valdr-miner.exe")
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portable
          if (-not (Test-Path $portable)) { throw "Windows portable archive missing" }

          $metadataPath = Join-Path $dist "artifact-metadata.json"
          $metadata = @{
            artifacts = @(
              @{
                filename = $installerName
                os = "windows"
                arch = "amd64"
                minimum_os = "Windows 10/11 x64"
                signing_status = "unsigned-development"
                notarization_status = "not_applicable"
              },
              @{
                filename = $portableName
                os = "windows"
                arch = "amd64"
                minimum_os = "Windows 10/11 x64"
                signing_status = "unsigned-development"
                notarization_status = "not_applicable"
              }
            )
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($metadataPath, $metadata, [System.Text.UTF8Encoding]::new($false))

          $releasedAt = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
          go run ./cmd/valdr-release-manifest `
            --artifacts-dir $dist `
            --metadata $metadataPath `
            --commit $env:GITHUB_SHA `
            --released-at $releasedAt `
            --output (Join-Path $dist "release-manifest.json") `
            --development
          if ($LASTEXITCODE -ne 0) { throw "development manifest generation failed" }
          Remove-Item $metadataPath -Force

          $manifest = Get-Content (Join-Path $dist "release-manifest.json") -Raw | ConvertFrom-Json
          if (-not $manifest.development) { throw "development manifest flag missing" }
          if ($manifest.version -ne $version) { throw "manifest version mismatch" }
          if ($manifest.git_commit -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw "manifest commit mismatch" }
          foreach ($artifact in $manifest.artifacts) {
            $artifactPath = Join-Path $dist $artifact.filename
            $actualHash = (Get-FileHash $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $artifact.sha256) {
              throw "manifest hash mismatch for $($artifact.filename)"
            }
          }

      - name: Clean install and uninstall Stage 13 Windows development package
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:RUNNER_TEMP "valdr-stage13-windows"
          $installer = Get-ChildItem $dist -Filter "*-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem $dist -Filter "*-portable.zip" | Select-Object -First 1
          if (-not $installer) { throw "development installer not found" }
          if (-not $portable) { throw "development portable archive not found" }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\VALDR Desktop"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited $($install.ExitCode)" }

          foreach ($name in @("VALDR.exe", "valdrd.exe", "valdr-miner.exe", "Uninstall.exe")) {
            if (-not (Test-Path (Join-Path $installDir $name))) {
              throw "installed file missing: $name"
            }
          }

          & (Join-Path $installDir "valdrd.exe") version
          if ($LASTEXITCODE -ne 0) { throw "installed valdrd version check failed" }
          & (Join-Path $installDir "valdr-miner.exe") version
          if ($LASTEXITCODE -ne 0) { throw "installed valdr-miner version check failed" }

          $stdout = Join-Path $env:RUNNER_TEMP "valdr-stage13-installed.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "valdr-stage13-installed.err.log"
          $desktop = Start-Process -FilePath (Join-Path $installDir "VALDR.exe") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($desktop.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "installed VALDR Desktop exited during launch smoke"
          }
          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

          $userData = Join-Path $env:LOCALAPPDATA "VALDR"
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $marker = Join-Path $userData "stage13-uninstall-preserve.marker"
          Set-Content -Path $marker -Value "preserve"

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited $($uninstall.ExitCode)" }

          for ($i = 0; $i -lt 60 -and (Test-Path $installDir); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) {
            Get-ChildItem -Force -Recurse $installDir | Format-List FullName,Length,Attributes
            throw "installer program directory survived uninstall"
          }
          if (-not (Test-Path $marker)) { throw "uninstaller removed VALDR user data" }

          $portableExtract = Join-Path $env:RUNNER_TEMP "valdr-stage13-portable-check"
          Remove-Item $portableExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $portable.FullName -DestinationPath $portableExtract
          foreach ($name in @("VALDR.exe", "valdrd.exe", "valdr-miner.exe")) {
            if (-not (Test-Path (Join-Path $portableExtract $name))) {
              throw "portable file missing: $name"
            }
          }
          & (Join-Path $portableExtract "valdrd.exe") version
          if ($LASTEXITCODE -ne 0) { throw "portable valdrd version check failed" }

      - name: Upload Stage 13 Windows development packages
        if: matrix.name == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: valdr-stage13-windows-development
          path: ${{ runner.temp }}/valdr-stage13-windows/**
          if-no-files-found: error

      - name: Upload native Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error



  stage13-release-assembly:
    name: stage13-release-assembly-development
    needs: [desktop-linux, desktop-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Linux Stage 13 packages
        uses: actions/download-artifact@v4
        with:
          name: valdr-stage13-linux-development
          path: ${{ runner.temp }}/stage13-input/linux

      - name: Download Windows Stage 13 packages
        uses: actions/download-artifact@v4
        with:
          name: valdr-stage13-windows-development
          path: ${{ runner.temp }}/stage13-input/windows

      - name: Download macOS ARM64 Stage 13 package
        uses: actions/download-artifact@v4
        with:
          name: valdr-stage13-macos-arm64-development
          path: ${{ runner.temp }}/stage13-input/macos-arm64

      - name: Download macOS Intel Stage 13 package
        uses: actions/download-artifact@v4
        with:
          name: valdr-stage13-macos-amd64-development
          path: ${{ runner.temp }}/stage13-input/macos-amd64

      - name: Assemble canonical Stage 13 development release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(go run ./cmd/valdrd version | awk '{print $NF}')"
          INPUT="$RUNNER_TEMP/stage13-input"
          DIST="$RUNNER_TEMP/valdr-stage13-release-assembly"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          WIN_SETUP="VALDR-Desktop-$VERSION-windows-x64-setup.exe"
          WIN_PORTABLE="VALDR-Desktop-$VERSION-windows-x64-portable.zip"
          LINUX_APPIMAGE="VALDR-Desktop-$VERSION-linux-x64.AppImage"
          LINUX_DEB="VALDR-Desktop-$VERSION-linux-amd64.deb"
          MAC_ARM64="VALDR-Desktop-$VERSION-macos-arm64.dmg"
          MAC_AMD64="VALDR-Desktop-$VERSION-macos-x64.dmg"

          install -m0644 "$INPUT/windows/$WIN_SETUP" "$DIST/$WIN_SETUP"
          install -m0644 "$INPUT/windows/$WIN_PORTABLE" "$DIST/$WIN_PORTABLE"
          install -m0755 "$INPUT/linux/$LINUX_APPIMAGE" "$DIST/$LINUX_APPIMAGE"
          install -m0644 "$INPUT/linux/$LINUX_DEB" "$DIST/$LINUX_DEB"
          install -m0644 "$INPUT/macos-arm64/$MAC_ARM64" "$DIST/$MAC_ARM64"
          install -m0644 "$INPUT/macos-amd64/$MAC_AMD64" "$DIST/$MAC_AMD64"

          cat >"$DIST/artifact-metadata.json" <<EOF
          {
            "artifacts": [
              {
                "filename": "$WIN_SETUP",
                "os": "windows",
                "arch": "amd64",
                "minimum_os": "Windows 10/11 x64",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              },
              {
                "filename": "$WIN_PORTABLE",
                "os": "windows",
                "arch": "amd64",
                "minimum_os": "Windows 10/11 x64",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              },
              {
                "filename": "$LINUX_APPIMAGE",
                "os": "linux",
                "arch": "amd64",
                "minimum_os": "Linux x86_64; CI baseline Ubuntu 24.04",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              },
              {
                "filename": "$LINUX_DEB",
                "os": "linux",
                "arch": "amd64",
                "minimum_os": "Debian/Ubuntu x86_64; CI baseline Ubuntu 24.04",
                "signing_status": "unsigned-development",
                "notarization_status": "not_applicable"
              },
              {
                "filename": "$MAC_ARM64",
                "os": "macos",
                "arch": "arm64",
                "minimum_os": "macOS 11.0+ ARM64",
                "signing_status": "adhoc-development",
                "notarization_status": "not-notarized-development"
              },
              {
                "filename": "$MAC_AMD64",
                "os": "macos",
                "arch": "amd64",
                "minimum_os": "macOS 10.13+ Intel x64",
                "signing_status": "adhoc-development",
                "notarization_status": "not-notarized-development"
              }
            ]
          }
          EOF

          RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          go run ./cmd/valdr-release-manifest             --artifacts-dir "$DIST"             --metadata "$DIST/artifact-metadata.json"             --commit "$GITHUB_SHA"             --released-at "$RELEASED_AT"             --output "$DIST/release-manifest.json"             --development

          python3 - "$DIST" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          dist = pathlib.Path(sys.argv[1])
          expected_commit = sys.argv[2].lower()
          manifest = json.loads((dist / "release-manifest.json").read_text())

          assert manifest["development"] is True
          assert manifest["release_kind"] == "development"
          assert manifest["git_commit"] == expected_commit
          assert manifest["network"] == "testnet"
          assert manifest["chain_id"] == "valdr-testnet-1"
          assert manifest["protocol_min"] == 2
          assert manifest["protocol_max"] == 2
          assert len(manifest["artifacts"]) == 6

          names = set()
          for artifact in manifest["artifacts"]:
              path = dist / artifact["filename"]
              assert path.is_file(), artifact["filename"]
              assert artifact["filename"] not in names
              names.add(artifact["filename"])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact["sha256"]
              assert path.stat().st_size == artifact["size_bytes"]

          package_files = {
              p.name
              for p in dist.iterdir()
              if p.is_file() and p.name != "release-manifest.json" and p.name != "artifact-metadata.json"
          }
          assert names == package_files, (names, package_files)
          PY

          # Production mode must fail closed while the repository is still on
          # the development version and development signing/notarization state.
          if go run ./cmd/valdr-release-manifest             --artifacts-dir "$DIST"             --metadata "$DIST/artifact-metadata.json"             --commit "$GITHUB_SHA"             --released-at "$RELEASED_AT"             --output "$DIST/production-manifest-should-not-exist.json"             >"$RUNNER_TEMP/stage13-production-negative.out"             2>"$RUNNER_TEMP/stage13-production-negative.err"; then
            echo "production manifest unexpectedly succeeded for development artifacts" >&2
            exit 1
          fi
          test ! -e "$DIST/production-manifest-should-not-exist.json"
          grep -q "production Testnet manifest cannot use development version" "$RUNNER_TEMP/stage13-production-negative.err"

          rm "$DIST/artifact-metadata.json"

          python3 - "$DIST/release-manifest.json" "$DIST/SHA256SUMS" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          lines = [
              f'{artifact["sha256"]}  {artifact["filename"]}'
              for artifact in manifest["artifacts"]
          ]
          pathlib.Path(sys.argv[2]).write_text("\n".join(lines) + "\n")
          PY
          (cd "$DIST" && sha256sum -c SHA256SUMS)

      - name: Generate keyless Sigstore provenance attestation
        id: stage13-attest
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/valdr-stage13-release-assembly/VALDR-Desktop-*
            ${{ runner.temp }}/valdr-stage13-release-assembly/release-manifest.json
            ${{ runner.temp }}/valdr-stage13-release-assembly/SHA256SUMS

      - name: Include provenance bundle in development release assembly
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.stage13-attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-release-assembly"
          VERSION="$(go run ./cmd/valdrd version | awk '{print $NF}')"
          test -s "$ATTESTATION_BUNDLE"
          install -m0644 "$ATTESTATION_BUNDLE" "$DIST/VALDR-Desktop-$VERSION-provenance.sigstore.json"

      - name: Upload canonical Stage 13 development release assembly
        uses: actions/upload-artifact@v4
        with:
          name: valdr-stage13-release-assembly-development
          path: ${{ runner.temp }}/valdr-stage13-release-assembly/**
          if-no-files-found: error

  stage13-release-verification-clean:
    name: stage13-release-verification-clean-development
    needs: stage13-release-assembly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download canonical Stage 13 development release
        uses: actions/download-artifact@v4
        with:
          name: valdr-stage13-release-assembly-development
          path: ${{ runner.temp }}/valdr-stage13-clean-verify

      - name: Verify development release from clean environment
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-clean-verify"
          cd "$DIST"

          test -f release-manifest.json
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS

          python3 - "$DIST/release-manifest.json" "$DIST/SHA256SUMS" "$EXPECTED_COMMIT" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          sums_path = pathlib.Path(sys.argv[2])
          expected_commit = sys.argv[3].lower()
          manifest = json.loads(manifest_path.read_text())

          assert manifest["schema_version"] == 1
          assert manifest["product"] == "VALDR Desktop"
          assert manifest["development"] is True
          assert manifest["release_kind"] == "development"
          assert manifest["git_commit"] == expected_commit
          assert re.fullmatch(r"[0-9a-f]{40}", manifest["git_commit"])
          assert manifest["network"] == "testnet"
          assert manifest["chain_id"] == "valdr-testnet-1"
          assert manifest["protocol_min"] == 2
          assert manifest["protocol_max"] == 2
          assert len(manifest["artifacts"]) == 6

          expected = {}
          for artifact in manifest["artifacts"]:
              name = artifact["filename"]
              path = manifest_path.parent / name
              assert path.is_file(), name
              assert name not in expected
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == artifact["sha256"], name
              assert path.stat().st_size == artifact["size_bytes"], name
              expected[name] = digest

          sums = {}
          for line in sums_path.read_text().splitlines():
              digest, name = line.split("  ", 1)
              assert re.fullmatch(r"[0-9a-f]{64}", digest), line
              assert name not in sums, name
              sums[name] = digest

          assert sums == expected
          assert all("development" in artifact["signing_status"] or artifact["os"] == "linux"
                     for artifact in manifest["artifacts"])
          assert manifest["provenance_method"] == "github-sigstore-keyless"
          assert manifest["provenance_required"] is True
          assert all(artifact["notarization_status"] != "notarized"
                     for artifact in manifest["artifacts"])
          PY

      - name: Verify keyless provenance from clean environment
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/valdr-stage13-clean-verify"
          BUNDLE="$(find "$DIST" -maxdepth 1 -name '*-provenance.sigstore.json' -print -quit)"
          test -s "$BUNDLE"
          gh --version
          while IFS= read -r artifact; do
            gh attestation verify "$artifact"               --repo Sheff1981/valdr-core               --bundle "$BUNDLE"               --signer-workflow Sheff1981/valdr-core/.github/workflows/valdr-v02-ci.yml               --source-digest "$EXPECTED_COMMIT"               --source-ref "$EXPECTED_REF"
          done < <(
            find "$DIST" -maxdepth 1 -type f \(               -name 'VALDR-Desktop-*.exe' -o               -name 'VALDR-Desktop-*.zip' -o               -name 'VALDR-Desktop-*.AppImage' -o               -name 'VALDR-Desktop-*.deb' -o               -name 'VALDR-Desktop-*.dmg' -o               -name 'release-manifest.json' -o               -name 'SHA256SUMS'             \) -print | sort
          )
