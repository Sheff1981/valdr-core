name: VALDR v0.2 CI

on:
  workflow_dispatch:
  push:
    branches: [ valdr-v0.2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Stage 13 release manifest gate
        run: go test ./cmd/valdr-release-manifest -count=1

      - name: Race test
        run: go test -race ./...

      - name: Storage v2 and migration gate
        run: go test ./storage ./core/blockchain ./cmd/valdrd

      - name: Network profiles and P2P v2 gate
        run: go test ./config ./p2p

      - name: Chainwork and reorg gate
        run: go test ./core/consensus ./core/blockchain ./storage

      - name: Difficulty v2 and timestamp gate
        run: go test ./config ./core/consensus

      - name: Fees and consensus size gate
        run: go test ./core/transaction ./core/block ./core/utxo ./core/blockchain ./mining

      - name: Mempool policy and miner template gate
        run: go test ./config ./core/mempool ./core/blockchain ./p2p ./mining

      - name: Headers-first sync gate
        run: go test ./p2p -run "TestV2(FreshNodeHeadersFirstSync|SyncResumesFromPersistedChainAfterRestart|HeadersFirstSyncReorgsToGreaterChainwork|SyncDecisionUsesCumulativeChainwork|LocatorContract|HeadersContract|InventoryContract)$" -count=1

      - name: Seed and P2P protection gate
        run: go test ./p2p -run "Test(SeedBootstrapContinuesPastOfflineSeed|InboundReservationLimits|TemporaryBanAfterMalformedThreshold|PublicDiscoveryRejectsUnsafeNumericAddresses|TokenBucketRejectsBurstAboveConfiguredLimit|BoundedDuplicateCacheEvictsOldest|IdleWatchdogPingsBeforeDisconnect|DiscoveryContinuesBeyondSeedNodes|LegacyBootstrapAndMaintainDoesNothingWithoutSeeds|BootstrapAndMaintainUsesDiscoveredPeersWithoutSeeds|ProtectionDefaultValues|V2PerMessagePayloadLimits)$" -count=1

      - name: Wallet v2 encryption and migration gate
        run: go test ./wallet ./cmd/valdr-cli -run "Test(Wallet|RPCBackedCLIStatusBalanceSendAndQueries)" -count=1

      - name: Explorer API and reorg gate
        run: go test ./explorer -run "TestExplorer" -count=1

      - name: Testnet runtime identity gate
        run: go test ./config ./core/block ./cmd/valdrd -run "Test(Testnet|V02NetworkProfiles)" -count=1

      - name: Stage 12 Desktop foundation gate
        run: go test ./desktop ./p2p -run "Test(Desktop|ResolveDesktop|OutboundOnly)" -count=1

      - name: Stage 12 RPC P2P and log secret-boundary gate
        run: go test ./desktop ./p2p -run "Test(DesktopRPCWireExcludesWalletSecrets|P2PWireAndTransactionLogsExcludeWalletSecrets)$" -count=1

      - name: v0.2.4 transaction network-binding gate
        run: go test ./core/transaction ./core/mempool ./core/blockchain ./wallet -run "Test(V2TransactionIsBoundToExpectedChain|V2CoinbaseIsBoundToExpectedChain|LegacyTransactionStillOmitsExplicitChainID|MempoolRejectsTransactionFromAnotherV2Network|TestnetRejectsDevnet2TransactionReplay|CreateTransactionForChainBuildsV2NetworkBoundTransaction)$" -count=1

      - name: Stage 12 outbound-only runtime smoke
        run: bash scripts/desktop-outbound-smoke.sh

      - name: Docker image build
        run: docker build -t valdr:testnet-v0.2 .

      - name: Docker Compose Testnet smoke
        run: bash scripts/docker-testnet-smoke.sh

      - name: Linux service smoke
        run: bash scripts/linux-service-smoke.sh

      - name: Three-node runtime smoke
        run: ./scripts/start-devnet.sh smoke


  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test -tags webkit2_41 ./...

      - name: Build Wails Desktop shell
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -tags "webkit2_41" -platform linux/amd64 -o VALDR

      - name: Bundle managed node and miner
        run: |
          go build -o apps/valdr-desktop/build/bin/valdrd ./cmd/valdrd
          go build -o apps/valdr-desktop/build/bin/valdr-miner ./cmd/valdr-miner
          test -x apps/valdr-desktop/build/bin/VALDR
          test -x apps/valdr-desktop/build/bin/valdrd
          test -x apps/valdr-desktop/build/bin/valdr-miner
          apps/valdr-desktop/build/bin/valdrd version
          apps/valdr-desktop/build/bin/valdr-miner version

      - name: Live Desktop wallet send/receive/history integration
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdr-miner
        run: go test -tags webkit2_41 -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          LOG="$RUNNER_TEMP/valdr-desktop-linux.log"

          Xvfb :99 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          apps/valdr-desktop/build/bin/VALDR >"$LOG" 2>&1 &
          DESKTOP_PID=$!

          stop_process() {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 0.25
            done
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          cleanup() {
            stop_process "$DESKTOP_PID"
            stop_process "$XVFB_PID"
          }
          trap cleanup EXIT

          sleep 5
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc             -H 'Content-Type: application/json'             --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh Desktop unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          stop_process "$DESKTOP_PID"
          stop_process "$XVFB_PID"
          trap - EXIT

      - name: Upload Linux Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: valdr-desktop-linux-amd64
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error

  desktop-native:
    name: desktop-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2025
            platform: windows/amd64
            output: VALDR.exe
            artifact: valdr-desktop-windows-amd64
            wails_args: "-webview2 embed"
          - name: macos-arm64
            os: macos-15
            platform: darwin/arm64
            output: VALDR
            artifact: valdr-desktop-macos-arm64
            wails_args: ""
          - name: macos-amd64
            os: macos-15-intel
            platform: darwin/amd64
            output: VALDR
            artifact: valdr-desktop-macos-amd64
            wails_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show native runner architecture
        run: go env GOOS GOARCH

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test ./...

      - name: Build native Wails Desktop
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -platform "${{ matrix.platform }}" -o "${{ matrix.output }}" ${{ matrix.wails_args }}

      - name: Bundle managed node and miner on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          go build -o "apps/valdr-desktop/build/bin/valdrd.exe" ./cmd/valdrd
          go build -o "apps/valdr-desktop/build/bin/valdr-miner.exe" ./cmd/valdr-miner
          if (-not (Test-Path "apps/valdr-desktop/build/bin/VALDR.exe")) { throw "VALDR.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdrd.exe")) { throw "valdrd.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdr-miner.exe")) { throw "valdr-miner.exe missing" }
          & "apps/valdr-desktop/build/bin/valdrd.exe" version
          & "apps/valdr-desktop/build/bin/valdr-miner.exe" version

      - name: Bundle managed node and miner on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          test -d "$APP/Contents/MacOS"
          go build -o "$APP/Contents/MacOS/valdrd" ./cmd/valdrd
          go build -o "$APP/Contents/MacOS/valdr-miner" ./cmd/valdr-miner
          test -x "$APP/Contents/MacOS/VALDR"
          test -x "$APP/Contents/MacOS/valdrd"
          test -x "$APP/Contents/MacOS/valdr-miner"
          "$APP/Contents/MacOS/valdrd" version
          "$APP/Contents/MacOS/valdr-miner" version
          codesign --force --sign - "$APP/Contents/MacOS/valdrd"
          codesign --force --sign - "$APP/Contents/MacOS/valdr-miner"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Live Desktop wallet send/receive/history integration on Windows
        if: matrix.name == 'windows-amd64'
        working-directory: apps/valdr-desktop
        shell: pwsh
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdrd.exe
          VALDR_MINER_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdr-miner.exe
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Live Desktop wallet send/receive/history integration on macOS
        if: startsWith(matrix.name, 'macos-')
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdr-miner
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valdr-desktop-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.err.log"
          $desktop = Start-Process -FilePath "apps/valdr-desktop/build/bin/VALDR.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          Start-Sleep -Seconds 5
          if ($desktop.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "VALDR Desktop exited during clean first-run launch"
          }
          try {
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}' | Out-Null
            Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            throw "fresh Desktop unexpectedly started valdrd before first wallet setup"
          } catch {
            if ($_.Exception.Message -eq "fresh Desktop unexpectedly started valdrd before first wallet setup") {
              throw
            }
          }

          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

      - name: Clean-launch Desktop smoke on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          LOG="$RUNNER_TEMP/valdr-desktop-macos.log"

          "$APP/Contents/MacOS/VALDR" >"$LOG" 2>&1 &
          DESKTOP_PID=$!
          cleanup() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 5
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if curl -fsS -X POST http://127.0.0.1:17332/rpc             -H 'Content-Type: application/json'             --data '{"method":"getStatus"}' >/dev/null 2>&1; then
            echo "fresh Desktop unexpectedly started valdrd before first wallet setup"
            exit 1
          fi

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Install NSIS for Stage 13 Windows packaging
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $command) {
            choco install nsis -y --no-progress
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "${env:ProgramFiles}\NSIS\makensis.exe"
            )
            $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $path) { throw "makensis.exe not found after NSIS installation" }
          } else {
            $path = $command.Source
          }
          & $path /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis version check failed" }
          "VALDR_MAKENSIS=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Stage 13 Windows development packages
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "apps\valdr-desktop\build\bin"
          $desktop = Join-Path $bin "VALDR.exe"
          $node = Join-Path $bin "valdrd.exe"
          $miner = Join-Path $bin "valdr-miner.exe"

          $versionLine = (& $node version | Out-String).Trim()
          $version = ($versionLine -split "\s+")[-1]
          if ($version -notmatch "^(\d+)\.(\d+)\.(\d+)") {
            throw "cannot derive numeric file version from $version"
          }
          $fileVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"

          $dist = Join-Path $env:RUNNER_TEMP "valdr-stage13-windows"
          $portableDir = Join-Path $env:RUNNER_TEMP "valdr-stage13-portable"
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist, $portableDir | Out-Null

          $installerName = "VALDR-Desktop-$version-windows-x64-setup.exe"
          $portableName = "VALDR-Desktop-$version-windows-x64-portable.zip"
          $installer = Join-Path $dist $installerName
          $portable = Join-Path $dist $portableName

          & $env:VALDR_MAKENSIS `
            "/DAPP_VERSION=$version" `
            "/DAPP_FILE_VERSION=$fileVersion" `
            "/DOUTFILE=$installer" `
            "/DDESKTOP_EXE=$desktop" `
            "/DNODE_EXE=$node" `
            "/DMINER_EXE=$miner" `
            "packaging\windows\valdr-desktop.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS package build failed" }
          if (-not (Test-Path $installer)) { throw "Windows installer missing" }

          Copy-Item $desktop (Join-Path $portableDir "VALDR.exe")
          Copy-Item $node (Join-Path $portableDir "valdrd.exe")
          Copy-Item $miner (Join-Path $portableDir "valdr-miner.exe")
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portable
          if (-not (Test-Path $portable)) { throw "Windows portable archive missing" }

          $metadataPath = Join-Path $dist "artifact-metadata.json"
          $metadata = @{
            artifacts = @(
              @{
                filename = $installerName
                os = "windows"
                arch = "amd64"
                minimum_os = "Windows 10/11 x64"
                signing_status = "unsigned-development"
                notarization_status = "not_applicable"
              },
              @{
                filename = $portableName
                os = "windows"
                arch = "amd64"
                minimum_os = "Windows 10/11 x64"
                signing_status = "unsigned-development"
                notarization_status = "not_applicable"
              }
            )
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($metadataPath, $metadata, [System.Text.UTF8Encoding]::new($false))

          $releasedAt = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
          go run ./cmd/valdr-release-manifest `
            --artifacts-dir $dist `
            --metadata $metadataPath `
            --commit $env:GITHUB_SHA `
            --released-at $releasedAt `
            --output (Join-Path $dist "release-manifest.json") `
            --development
          if ($LASTEXITCODE -ne 0) { throw "development manifest generation failed" }
          Remove-Item $metadataPath -Force

          $manifest = Get-Content (Join-Path $dist "release-manifest.json") -Raw | ConvertFrom-Json
          if (-not $manifest.development) { throw "development manifest flag missing" }
          if ($manifest.version -ne $version) { throw "manifest version mismatch" }
          if ($manifest.git_commit -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw "manifest commit mismatch" }
          foreach ($artifact in $manifest.artifacts) {
            $artifactPath = Join-Path $dist $artifact.filename
            $actualHash = (Get-FileHash $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $artifact.sha256) {
              throw "manifest hash mismatch for $($artifact.filename)"
            }
          }

      - name: Clean install and uninstall Stage 13 Windows development package
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:RUNNER_TEMP "valdr-stage13-windows"
          $installer = Get-ChildItem $dist -Filter "*-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem $dist -Filter "*-portable.zip" | Select-Object -First 1
          if (-not $installer) { throw "development installer not found" }
          if (-not $portable) { throw "development portable archive not found" }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\VALDR Desktop"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited $($install.ExitCode)" }

          foreach ($name in @("VALDR.exe", "valdrd.exe", "valdr-miner.exe", "Uninstall.exe")) {
            if (-not (Test-Path (Join-Path $installDir $name))) {
              throw "installed file missing: $name"
            }
          }

          & (Join-Path $installDir "valdrd.exe") version
          if ($LASTEXITCODE -ne 0) { throw "installed valdrd version check failed" }
          & (Join-Path $installDir "valdr-miner.exe") version
          if ($LASTEXITCODE -ne 0) { throw "installed valdr-miner version check failed" }

          $stdout = Join-Path $env:RUNNER_TEMP "valdr-stage13-installed.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "valdr-stage13-installed.err.log"
          $desktop = Start-Process -FilePath (Join-Path $installDir "VALDR.exe") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($desktop.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "installed VALDR Desktop exited during launch smoke"
          }
          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

          $userData = Join-Path $env:LOCALAPPDATA "VALDR"
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $marker = Join-Path $userData "stage13-uninstall-preserve.marker"
          Set-Content -Path $marker -Value "preserve"

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited $($uninstall.ExitCode)" }

          for ($i = 0; $i -lt 20 -and (Test-Path $installDir); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) { throw "installer program directory survived uninstall" }
          if (-not (Test-Path $marker)) { throw "uninstaller removed VALDR user data" }

          $portableExtract = Join-Path $env:RUNNER_TEMP "valdr-stage13-portable-check"
          Remove-Item $portableExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $portable.FullName -DestinationPath $portableExtract
          foreach ($name in @("VALDR.exe", "valdrd.exe", "valdr-miner.exe")) {
            if (-not (Test-Path (Join-Path $portableExtract $name))) {
              throw "portable file missing: $name"
            }
          }
          & (Join-Path $portableExtract "valdrd.exe") version
          if ($LASTEXITCODE -ne 0) { throw "portable valdrd version check failed" }

      - name: Upload Stage 13 Windows development packages
        if: matrix.name == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: valdr-stage13-windows-development
          path: ${{ runner.temp }}/valdr-stage13-windows/**
          if-no-files-found: error

      - name: Upload native Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error

