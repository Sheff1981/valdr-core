name: VALDR v0.2 CI

on:
  workflow_dispatch:
  push:
    branches: [ valdr-v0.2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Storage v2 and migration gate
        run: go test ./storage ./core/blockchain ./cmd/valdrd

      - name: Network profiles and P2P v2 gate
        run: go test ./config ./p2p

      - name: Chainwork and reorg gate
        run: go test ./core/consensus ./core/blockchain ./storage

      - name: Difficulty v2 and timestamp gate
        run: go test ./config ./core/consensus

      - name: Fees and consensus size gate
        run: go test ./core/transaction ./core/block ./core/utxo ./core/blockchain ./mining

      - name: Mempool policy and miner template gate
        run: go test ./config ./core/mempool ./core/blockchain ./p2p ./mining

      - name: Headers-first sync gate
        run: go test ./p2p -run "TestV2(FreshNodeHeadersFirstSync|SyncResumesFromPersistedChainAfterRestart|HeadersFirstSyncReorgsToGreaterChainwork|SyncDecisionUsesCumulativeChainwork|LocatorContract|HeadersContract|InventoryContract)$" -count=1

      - name: Seed and P2P protection gate
        run: go test ./p2p -run "Test(SeedBootstrapContinuesPastOfflineSeed|InboundReservationLimits|TemporaryBanAfterMalformedThreshold|PublicDiscoveryRejectsUnsafeNumericAddresses|TokenBucketRejectsBurstAboveConfiguredLimit|BoundedDuplicateCacheEvictsOldest|IdleWatchdogPingsBeforeDisconnect|DiscoveryContinuesBeyondSeedNodes|BootstrapAndMaintainDoesNothingWithoutSeeds|ProtectionDefaultValues|V2PerMessagePayloadLimits)$" -count=1

      - name: Wallet v2 encryption and migration gate
        run: go test ./wallet ./cmd/valdr-cli -run "Test(Wallet|RPCBackedCLIStatusBalanceSendAndQueries)" -count=1

      - name: Explorer API and reorg gate
        run: go test ./explorer -run "TestExplorer" -count=1

      - name: Testnet runtime identity gate
        run: go test ./config ./core/block ./cmd/valdrd -run "Test(Testnet|V02NetworkProfiles)" -count=1

      - name: Stage 12 Desktop foundation gate
        run: go test ./desktop ./p2p -run "Test(Desktop|ResolveDesktop|OutboundOnly)" -count=1

      - name: v0.2.4 transaction network-binding gate
        run: go test ./core/transaction ./core/mempool ./core/blockchain ./wallet -run "Test(V2TransactionIsBoundToExpectedChain|V2CoinbaseIsBoundToExpectedChain|LegacyTransactionStillOmitsExplicitChainID|MempoolRejectsTransactionFromAnotherV2Network|TestnetRejectsDevnet2TransactionReplay|CreateTransactionForChainBuildsV2NetworkBoundTransaction)$" -count=1

      - name: Stage 12 outbound-only runtime smoke
        run: bash scripts/desktop-outbound-smoke.sh

      - name: Docker image build
        run: docker build -t valdr:testnet-v0.2 .

      - name: Docker Compose Testnet smoke
        run: bash scripts/docker-testnet-smoke.sh

      - name: Linux service smoke
        run: bash scripts/linux-service-smoke.sh

      - name: Three-node runtime smoke
        run: ./scripts/start-devnet.sh smoke


  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test -tags webkit2_41 ./...

      - name: Build Wails Desktop shell
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -tags "webkit2_41" -platform linux/amd64 -o VALDR

      - name: Bundle managed node and miner
        run: |
          go build -o apps/valdr-desktop/build/bin/valdrd ./cmd/valdrd
          go build -o apps/valdr-desktop/build/bin/valdr-miner ./cmd/valdr-miner
          test -x apps/valdr-desktop/build/bin/VALDR
          test -x apps/valdr-desktop/build/bin/valdrd
          test -x apps/valdr-desktop/build/bin/valdr-miner
          apps/valdr-desktop/build/bin/valdrd version
          apps/valdr-desktop/build/bin/valdr-miner version

      - name: Live Desktop wallet send/receive/history integration
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/valdr-miner
        run: go test -tags webkit2_41 -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          LOG="$RUNNER_TEMP/valdr-desktop-linux.log"
          STATUS="$RUNNER_TEMP/valdr-desktop-linux-status.json"

          Xvfb :99 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          apps/valdr-desktop/build/bin/VALDR >"$LOG" 2>&1 &
          DESKTOP_PID=$!

          cleanup() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            if curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >"$STATUS"; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi
          grep -q '"network":"testnet"' "$STATUS"

          apps/valdr-desktop/build/bin/valdr-miner start \
            --node http://127.0.0.1:17332 \
            --reward-address VDR1NGF6UY64ISRUIZR76FBJV2QQQQW7E63LY2C6SUA \
            --blocks 1 \
            --interval 0s \
            --pid-file "$RUNNER_TEMP/valdr-desktop-restart-miner.pid" \
            >"$RUNNER_TEMP/valdr-desktop-restart-miner.json"

          curl -fsS -X POST http://127.0.0.1:17332/rpc \
            -H 'Content-Type: application/json' \
            --data '{"method":"getStatus"}' >"$RUNNER_TEMP/valdr-desktop-before-restart.json"
          BEFORE_HEIGHT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["height"])' "$RUNNER_TEMP/valdr-desktop-before-restart.json")"
          BEFORE_TIP="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["tip_hash"])' "$RUNNER_TEMP/valdr-desktop-before-restart.json")"
          test "$BEFORE_HEIGHT" -ge 1
          test -n "$BEFORE_TIP"

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true

          CLOSED=0
          for _ in $(seq 1 10); do
            if ! curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >/dev/null 2>&1; then
              CLOSED=1
              break
            fi
            sleep 1
          done
          if [ "$CLOSED" -ne 1 ]; then
            echo "managed valdrd RPC remained online after Desktop exit"
            exit 1
          fi

          apps/valdr-desktop/build/bin/VALDR >>"$LOG" 2>&1 &
          DESKTOP_PID=$!
          RESTART_READY=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            if curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >"$RUNNER_TEMP/valdr-desktop-after-restart.json"; then
              RESTART_READY=1
              break
            fi
            sleep 1
          done
          if [ "$RESTART_READY" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi

          AFTER_HEIGHT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["height"])' "$RUNNER_TEMP/valdr-desktop-after-restart.json")"
          AFTER_TIP="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["tip_hash"])' "$RUNNER_TEMP/valdr-desktop-after-restart.json")"
          test "$AFTER_HEIGHT" = "$BEFORE_HEIGHT"
          test "$AFTER_TIP" = "$BEFORE_TIP"

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true

          kill "$XVFB_PID" 2>/dev/null || true
          wait "$XVFB_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload Linux Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: valdr-desktop-linux-amd64
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error

  desktop-native:
    name: desktop-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2025
            platform: windows/amd64
            output: VALDR.exe
            artifact: valdr-desktop-windows-amd64
          - name: macos-arm64
            os: macos-15
            platform: darwin/arm64
            output: VALDR
            artifact: valdr-desktop-macos-arm64
          - name: macos-amd64
            os: macos-15-intel
            platform: darwin/amd64
            output: VALDR
            artifact: valdr-desktop-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show native runner architecture
        run: go env GOOS GOARCH

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify Desktop module lock
        working-directory: apps/valdr-desktop
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test ./...

      - name: Build native Wails Desktop
        working-directory: apps/valdr-desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -s -nosyncgomod -platform "${{ matrix.platform }}" -o "${{ matrix.output }}"

      - name: Bundle managed node and miner on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          go build -o "apps/valdr-desktop/build/bin/valdrd.exe" ./cmd/valdrd
          go build -o "apps/valdr-desktop/build/bin/valdr-miner.exe" ./cmd/valdr-miner
          if (-not (Test-Path "apps/valdr-desktop/build/bin/VALDR.exe")) { throw "VALDR.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdrd.exe")) { throw "valdrd.exe missing" }
          if (-not (Test-Path "apps/valdr-desktop/build/bin/valdr-miner.exe")) { throw "valdr-miner.exe missing" }
          & "apps/valdr-desktop/build/bin/valdrd.exe" version
          & "apps/valdr-desktop/build/bin/valdr-miner.exe" version

      - name: Bundle managed node and miner on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          test -d "$APP/Contents/MacOS"
          go build -o "$APP/Contents/MacOS/valdrd" ./cmd/valdrd
          go build -o "$APP/Contents/MacOS/valdr-miner" ./cmd/valdr-miner
          test -x "$APP/Contents/MacOS/VALDR"
          test -x "$APP/Contents/MacOS/valdrd"
          test -x "$APP/Contents/MacOS/valdr-miner"
          "$APP/Contents/MacOS/valdrd" version
          "$APP/Contents/MacOS/valdr-miner" version
          codesign --force --sign - "$APP/Contents/MacOS/valdrd"
          codesign --force --sign - "$APP/Contents/MacOS/valdr-miner"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Live Desktop wallet send/receive/history integration on Windows
        if: matrix.name == 'windows-amd64'
        working-directory: apps/valdr-desktop
        shell: pwsh
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdrd.exe
          VALDR_MINER_PATH: ${{ github.workspace }}\apps\valdr-desktop\build\bin\valdr-miner.exe
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Live Desktop wallet send/receive/history integration on macOS
        if: startsWith(matrix.name, 'macos-')
        working-directory: apps/valdr-desktop
        shell: bash
        env:
          VALDR_DESKTOP_RUNTIME_E2E: "1"
          VALDRD_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdrd
          VALDR_MINER_PATH: ${{ github.workspace }}/apps/valdr-desktop/build/bin/VALDR Desktop.app/Contents/MacOS/valdr-miner
        run: go test -run TestDesktopRuntimeWalletSendReceiveHistory -count=1

      - name: Clean-launch Desktop smoke on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valdr-desktop-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "valdr-desktop-windows.err.log"
          $desktop = Start-Process -FilePath "apps/valdr-desktop/build/bin/VALDR.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ($desktop.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "VALDR Desktop exited before local RPC became ready"
            }
            try {
              $status = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}'
              if ($status.result.network -eq "testnet") {
                $ready = $true
                break
              }
            } catch {
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            throw "VALDR Desktop did not start bundled valdrd"
          }

          & "apps/valdr-desktop/build/bin/valdr-miner.exe" start `
            --node "http://127.0.0.1:17332" `
            --reward-address "VDR1NGF6UY64ISRUIZR76FBJV2QQQQW7E63LY2C6SUA" `
            --blocks 1 `
            --interval 0s `
            --pid-file (Join-Path $env:RUNNER_TEMP "valdr-desktop-restart-miner.pid")
          if ($LASTEXITCODE -ne 0) { throw "valdr-miner failed to mine restart-state block" }

          $before = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}'
          $beforeHeight = [uint64]$before.result.height
          $beforeTip = [string]$before.result.tip_hash
          if ($beforeHeight -lt 1) { throw "expected mined chain height >= 1" }
          if ([string]::IsNullOrWhiteSpace($beforeTip)) { throw "missing tip hash before restart" }

          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

          $closed = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}' | Out-Null
            } catch {
              $closed = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $closed) {
            throw "managed valdrd RPC remained online after Desktop exit"
          }

          $desktop = Start-Process -FilePath "apps/valdr-desktop/build/bin/VALDR.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $restartReady = $false
          $after = $null
          for ($i = 0; $i -lt 30; $i++) {
            if ($desktop.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "VALDR Desktop exited during restart persistence smoke"
            }
            try {
              $after = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:17332/rpc" -ContentType "application/json" -Body '{"method":"getStatus"}'
              $restartReady = $true
              break
            } catch {
            }
            Start-Sleep -Seconds 1
          }
          if (-not $restartReady) { throw "VALDR Desktop did not restore local RPC after restart" }
          if ([uint64]$after.result.height -ne $beforeHeight) {
            throw "blockchain height changed across Desktop restart"
          }
          if ([string]$after.result.tip_hash -ne $beforeTip) {
            throw "blockchain tip changed across Desktop restart"
          }

          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

      - name: Clean-launch Desktop smoke on macOS
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          APP="apps/valdr-desktop/build/bin/VALDR Desktop.app"
          LOG="$RUNNER_TEMP/valdr-desktop-macos.log"
          STATUS="$RUNNER_TEMP/valdr-desktop-macos-status.json"

          "$APP/Contents/MacOS/VALDR" >"$LOG" 2>&1 &
          DESKTOP_PID=$!
          cleanup() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            if curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >"$STATUS"; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi
          grep -q '"network":"testnet"' "$STATUS"

          "$APP/Contents/MacOS/valdr-miner" start \
            --node http://127.0.0.1:17332 \
            --reward-address VDR1NGF6UY64ISRUIZR76FBJV2QQQQW7E63LY2C6SUA \
            --blocks 1 \
            --interval 0s \
            --pid-file "$RUNNER_TEMP/valdr-desktop-restart-miner.pid" \
            >"$RUNNER_TEMP/valdr-desktop-restart-miner.json"

          curl -fsS -X POST http://127.0.0.1:17332/rpc \
            -H 'Content-Type: application/json' \
            --data '{"method":"getStatus"}' >"$RUNNER_TEMP/valdr-desktop-before-restart.json"
          BEFORE_HEIGHT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["height"])' "$RUNNER_TEMP/valdr-desktop-before-restart.json")"
          BEFORE_TIP="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["tip_hash"])' "$RUNNER_TEMP/valdr-desktop-before-restart.json")"
          test "$BEFORE_HEIGHT" -ge 1
          test -n "$BEFORE_TIP"

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true

          CLOSED=0
          for _ in $(seq 1 10); do
            if ! curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >/dev/null 2>&1; then
              CLOSED=1
              break
            fi
            sleep 1
          done
          if [ "$CLOSED" -ne 1 ]; then
            echo "managed valdrd RPC remained online after Desktop exit"
            exit 1
          fi

          "$APP/Contents/MacOS/VALDR" >>"$LOG" 2>&1 &
          DESKTOP_PID=$!
          RESTART_READY=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            if curl -fsS -X POST http://127.0.0.1:17332/rpc \
              -H 'Content-Type: application/json' \
              --data '{"method":"getStatus"}' >"$RUNNER_TEMP/valdr-desktop-after-restart.json"; then
              RESTART_READY=1
              break
            fi
            sleep 1
          done
          if [ "$RESTART_READY" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi

          AFTER_HEIGHT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["height"])' "$RUNNER_TEMP/valdr-desktop-after-restart.json")"
          AFTER_TIP="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["tip_hash"])' "$RUNNER_TEMP/valdr-desktop-after-restart.json")"
          test "$AFTER_HEIGHT" = "$BEFORE_HEIGHT"
          test "$AFTER_TIP" = "$BEFORE_TIP"

          kill "$DESKTOP_PID"
          wait "$DESKTOP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload native Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/valdr-desktop/build/bin/**
          if-no-files-found: error

