name: VALDR v0.2 CI

on:
  workflow_dispatch:
  push:
    branches: [ valdr-v0.2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Storage v2 and migration gate
        run: go test ./storage ./core/blockchain ./cmd/valdrd

      - name: Network profiles and P2P v2 gate
        run: go test ./config ./p2p

      - name: Chainwork and reorg gate
        run: go test ./core/consensus ./core/blockchain ./storage

      - name: Difficulty v2 and timestamp gate
        run: go test ./config ./core/consensus

      - name: Fees and consensus size gate
        run: go test ./core/transaction ./core/block ./core/utxo ./core/blockchain ./mining

      - name: Mempool policy and miner template gate
        run: go test ./config ./core/mempool ./core/blockchain ./p2p ./mining

      - name: Headers-first sync gate
        run: go test ./p2p -run "TestV2(FreshNodeHeadersFirstSync|SyncResumesFromPersistedChainAfterRestart|HeadersFirstSyncReorgsToGreaterChainwork|SyncDecisionUsesCumulativeChainwork|LocatorContract|HeadersContract|InventoryContract)$" -count=1

      - name: Seed and P2P protection gate
        run: go test ./p2p -run "Test(SeedBootstrapContinuesPastOfflineSeed|InboundReservationLimits|TemporaryBanAfterMalformedThreshold|PublicDiscoveryRejectsUnsafeNumericAddresses|TokenBucketRejectsBurstAboveConfiguredLimit|BoundedDuplicateCacheEvictsOldest|IdleWatchdogPingsBeforeDisconnect|DiscoveryContinuesBeyondSeedNodes|BootstrapAndMaintainDoesNothingWithoutSeeds|ProtectionDefaultValues|V2PerMessagePayloadLimits)$" -count=1

      - name: Wallet v2 encryption and migration gate
        run: go test ./wallet ./cmd/valdr-cli -run "Test(Wallet|RPCBackedCLIStatusBalanceSendAndQueries)" -count=1

      - name: Explorer API and reorg gate
        run: go test ./explorer -run "TestExplorer" -count=1

      - name: Testnet runtime identity gate
        run: go test ./config ./core/block ./cmd/valdrd -run "Test(Testnet|V02NetworkProfiles)" -count=1

      - name: Stage 12 Desktop foundation gate
        run: go test ./desktop ./p2p -run "Test(Desktop|ResolveDesktop|OutboundOnly)" -count=1

      - name: Stage 12 outbound-only runtime smoke
        run: bash scripts/desktop-outbound-smoke.sh

      - name: Docker image build
        run: docker build -t valdr:testnet-v0.2 .

      - name: Docker Compose Testnet smoke
        run: bash scripts/docker-testnet-smoke.sh

      - name: Linux service smoke
        run: bash scripts/linux-service-smoke.sh

      - name: Three-node runtime smoke
        run: ./scripts/start-devnet.sh smoke


  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VALDR
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/valdr-desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build Desktop frontend
        working-directory: apps/valdr-desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test Wails Desktop backend
        working-directory: apps/valdr-desktop
        run: go test -tags webkit2_41 ./...

      - name: Build Wails Desktop shell
        working-directory: apps/valdr-desktop
        run: go build -tags webkit2_41 -o ../../build/valdr-desktop-linux .
