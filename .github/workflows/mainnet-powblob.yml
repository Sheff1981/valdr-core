name: VALDR Mainnet PoW Blob Prototype

on:
  push:
    branches:
      - experiment/mainnet-randomx-prototype
    paths:
      - "experiments/mainnet-powblob/**"
      - ".github/workflows/mainnet-powblob.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test ./experiments/mainnet-powblob -count=1
