name: VALDR Mainnet M5 DAA Simulation

on:
  push:
    branches:
      - experiment/mainnet-randomx-prototype
    paths:
      - "experiments/mainnet-m5-daa-sim/**"
      - "core/consensus/mainnet_lwma_candidate.go"
      - ".github/workflows/mainnet-m5-daa-sim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: M5 DAA policy tests
        run: go test ./experiments/mainnet-m5-daa-sim -count=1
      - name: Reproduce M5 DAA matrix
        run: go run ./experiments/mainnet-m5-daa-sim
