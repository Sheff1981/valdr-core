name: VALDR Mainnet RandomX Candidate Validation

on:
  push:
    branches:
      - experiment/mainnet-randomx-prototype
    paths:
      - "core/consensus/mainnet_candidate_validation.go"
      - "core/consensus/mainnet_candidate_validation_test.go"
      - "storage/mainnet_randomx_validation.go"
      - ".github/workflows/mainnet-randomx-candidate-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Candidate validation tests
        run: |
          go test ./core/consensus -run "TestValidateMainnetRandomXCandidate" -count=1
          go test ./storage -run "TestRandomXAncestrySource" -count=1
