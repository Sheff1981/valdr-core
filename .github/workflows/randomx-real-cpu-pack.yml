name: VALDR RandomX Real CPU Pack

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/mainnet-randomx-prototype
    paths:
      - "experiments/randomx-prototype/benchmark-real-cpu.*"
      - "experiments/randomx-prototype/REAL_CPU_BENCHMARK.md"
      - "experiments/randomx-prototype/RUN-VALDR-BENCHMARK.cmd"
      - "experiments/randomx-prototype/README_WINDOWS_RU.md"
      - ".github/workflows/randomx-real-cpu-pack.yml"

permissions:
  contents: read

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build RandomX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/tevador/RandomX.git rx
          git -C rx checkout 12f2c2ffe2108d6cf54c391fee33c8bc3646cdab
          cmake -S rx -B rx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build rx/build --config Release --parallel
          mkdir -p pack
          cp rx/build/randomx-benchmark pack/
          cp experiments/randomx-prototype/benchmark-real-cpu.sh pack/
          cp experiments/randomx-prototype/REAL_CPU_BENCHMARK.md pack/README.md
          chmod +x pack/randomx-benchmark pack/benchmark-real-cpu.sh

      - name: Build RandomX Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/tevador/RandomX.git rx
          git -C rx checkout 12f2c2ffe2108d6cf54c391fee33c8bc3646cdab
          cmake -S rx -B rx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build rx/build --config Release --parallel
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item rx/build/Release/randomx-benchmark.exe pack/
          Copy-Item experiments/randomx-prototype/benchmark-real-cpu.ps1 pack/
          Copy-Item experiments/randomx-prototype/RUN-VALDR-BENCHMARK.cmd pack/
          Copy-Item experiments/randomx-prototype/README_WINDOWS_RU.md pack/README_WINDOWS_RU.md
          Copy-Item experiments/randomx-prototype/REAL_CPU_BENCHMARK.md pack/README.md
          $files = @(
            "pack/randomx-benchmark.exe",
            "pack/benchmark-real-cpu.ps1",
            "pack/RUN-VALDR-BENCHMARK.cmd",
            "pack/README_WINDOWS_RU.md"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii pack/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: valdr-randomx-real-cpu-${{ runner.os }}-${{ runner.arch }}
          path: pack/
